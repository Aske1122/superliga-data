project:
  type: website
  output-dir: docs          # GitHub Pages: Settings → Pages → "Deploy from branch" → main /docs
  render:
    - "*.qmd"
    - "!README.md"
    - "!STATUS.md"
  resources:
    - /fonts/*-OFL.txt      # skrifternes licenser følger med (krav i SIL OFL 1.1)
    - /billeder/delingskort.png
  pre-render: scripts/foer_render.py     # beregner artiklernes læsetid
  post-render: scripts/efter_render.py   # fjerner kladdernes billeder fra docs/

execute:
  freeze: auto              # beregninger gemmes i _freeze/, så siden kan bygges uden data/

website:
  title: "Superliga Data"
  description: "Dansk fodbold set gennem data"
  site-url: "https://aske1122.github.io/superliga-data/"
  repo-url: "https://github.com/Aske1122/superliga-data"
  image: billeder/delingskort.png      # standard-delingskort; artikler bruger deres egen hovedgraf
  favicon: favicon.svg
  open-graph:                          # delingskort på LinkedIn, Facebook, Messenger
    locale: da_DK
    site-name: Superliga Data
  twitter-card:                        # delingskort på X
    card-style: summary_large_image
  search: false             # ingen søgeikon i menuen
  navbar:
    title: "Superliga Data"
    collapse: false         # ingen hamburger-ikon: menuen ombrydes i stedet på mobil
    right:
      - href: arkiv.qmd
        text: Arkiv
      - href: tal/index.qmd
        text: Superligaen i tal
      - href: metode.qmd
        text: Metode
      - href: om.qmd
        text: Om
  page-footer:
    left: |
      **Superliga Data**<br>
      Dansk fodbold set gennem data.
    center: |
      ::: {.fod-kolonne}
      **Om**<br>
      [Om siden](/om.qmd)<br>
      [Arkiv](/arkiv.qmd)
      :::
      ::: {.fod-kolonne}
      **Metode**<br>
      [Metode og data](/metode.qmd)<br>
      [Superligaen i tal](/tal/index.qmd)
      :::
      ::: {.fod-kolonne}
      **Kontakt**<br>
      [GitHub](https://github.com/Aske1122/superliga-data)<br>
      [RSS](/index.xml)
      :::
    right: |
      Kode: [MIT](https://github.com/Aske1122/superliga-data/blob/main/LICENSE) · Tekst og grafer: [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.da)<br>
      Data: Sportmonks. Skrift: Inter og Newsreader (SIL OFL 1.1). Design inspireret af Tufte CSS (MIT). Bygget med Quarto.

lang: da

format:
  html:
    theme: [default, styles.scss] # neutralt grundtema, overskrevet af vores eget design
    include-after-body: _partials/signatur.html   # kompakt menu, kampur-læsebjælke, rubrik
    toc: false                   # margen bruges til noter, ikke indholdsfortegnelse
    reference-location: margin   # fodnoter vises som margennoter
    citation-location: margin
    cap-location: margin
    fig-align: left
    smooth-scroll: true
    title-block-banner: false
    grid:
      body-width: 680px          # tekstkolonne (650–700 px)
      margin-width: 280px        # margennoter
      gutter-width: 2.5rem
